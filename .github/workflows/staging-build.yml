name: Build hosted staging for review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      METTELO_MEMBER_ENVIRONMENT: staging
      NEXT_PUBLIC_SITE_ORIGIN: https://staging.mettelo.com
      NEXT_PUBLIC_AUTH_CALLBACK_ORIGIN: https://staging.mettelo.com
      NEXT_PUBLIC_SUPABASE_URL: https://jxijdjmjuzslmjxolhjl.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.METTELO_STAGING_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_AUTH_GOOGLE_ENABLED: 'false'
      METTELO_PUBLIC_INDEXING_ENABLED: 'false'
      METTELO_LAB_EMAIL_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix apps/member --no-audit --no-fund
      - run: npm --prefix apps/member test
      - run: npm run staging:build
      - uses: actions/upload-artifact@v4
        with:
          name: mettelo-staging-runtime
          path: apps/member/.next/standalone
          include-hidden-files: true
          retention-days: 7
